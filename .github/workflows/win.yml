name: Windows.

on:
  workflow_dispatch:

jobs:

  windows:
    name: Windows
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || ((github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/nightly') && 'depot-windows-latest-16' || 'windows-latest') }}

    strategy:
      matrix:
        arch: [x64]
        qt: [qt6]
        generator: [""]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages" 2>nul

      - name: Install ATL.
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          echo VS install path: %VSPATH%
          echo VCToolsVersion: %VCToolsVersion%
          if exist "%VSPATH%\VC\Tools\MSVC\%VCToolsVersion%\atlmfc\include\atlbase.h" (
            echo ATL headers already present in MSVC toolset, skipping install.
            exit /b 0
          )
          echo Attempting to install ATL component via vs_installer.exe...
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "%VSPATH%" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --wait --norestart
          echo vs_installer.exe returned: %errorlevel%
          if exist "%VSPATH%\VC\Tools\MSVC\%VCToolsVersion%\atlmfc\include\atlbase.h" (
            echo ATL headers installed successfully via vs_installer.exe.
            exit /b 0
          )
          echo vs_installer.exe did not install ATL, trying choco...
          choco install visualstudio2022-workload-vctools -y --no-progress --package-parameters "--quiet --wait --norestart" || echo choco install returned: %errorlevel%
          if exist "%VSPATH%\VC\Tools\MSVC\%VCToolsVersion%\atlmfc\include\atlbase.h" (
            echo ATL headers installed successfully via choco.
            exit /b 0
          )
          echo Searching for ATL headers in other VS installations...
          for /f "usebackq delims=" %%j in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -all -property installationPath`) do (
            for /d %%m in ("%%j\VC\Tools\MSVC\*") do (
              if exist "%%m\atlmfc\include\atlbase.h" (
                echo ATL found at %%m\atlmfc, copying to primary installation...
                xcopy /E /I /Y "%%m\atlmfc" "%VSPATH%\VC\Tools\MSVC\%VCToolsVersion%\atlmfc"
                if not errorlevel 1 (
                  echo ATL headers copied successfully from other VS installation.
                  exit /b 0
                )
              )
            )
          )
          for /f "usebackq delims=" %%j in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -all -property installationPath`) do (
            if exist "%%j\atlmfc\include\atlbase.h" (
              echo ATL found at %%j\atlmfc, copying to primary installation...
              mkdir "%VSPATH%\VC\Tools\MSVC\%VCToolsVersion%\atlmfc" 2>nul
              xcopy /E /I /Y "%%j\atlmfc\include" "%VSPATH%\VC\Tools\MSVC\%VCToolsVersion%\atlmfc\include"
              if exist "%%j\atlmfc\lib" xcopy /E /I /Y "%%j\atlmfc\lib" "%VSPATH%\VC\Tools\MSVC\%VCToolsVersion%\atlmfc\lib"
              exit /b 0
            )
          )
          echo ERROR: ATL headers not found. dump_syms build requires ATL.
          exit /b 1

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-

      - name: Free up disk space before Libraries.
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h C: || true

          # Kill ASLR and code generation stuff (not needed)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium 2>/dev/null || true
          sudo rm -rf /usr/local/lib/node_modules /usr/local/ghc 2>/dev/null || true
          sudo rm -rf /opt/microsoft /opt/az 2>/dev/null || true
          sudo rm -rf /usr/local/julia* /usr/local/share/julia 2>/dev/null || true
          sudo rm -rf /usr/share/miniconda 2>/dev/null || true
          sudo rm -rf /usr/share/rust /usr/share/swift 2>/dev/null || true
          sudo rm -rf /usr/local/LiteIDE 2>/dev/null || true
          # Aggressive temp + cache cleanup
          sudo rm -rf /tmp/* /var/tmp/* /var/log/* /var/cache/* 2>/dev/null || true
          sudo rm -rf /c/Users/*/AppData/Local/Temp/* 2>/dev/null || true
          sudo rm -rf /c/Users/*/AppData/Local/Microsoft/Windows/INetCache/* 2>/dev/null || true
          sudo rm -rf /c/Users/*/AppData/Local/PipCache 2>/dev/null || true
          sudo rm -rf /c/Users/*/AppData/Local/NuGet 2>/dev/null || true
          # vcpkg cache
          sudo rm -rf /usr/local/vcpkg 2>/dev/null || true
          rm -rf /c/vcpkg 2>/dev/null || true

          echo "Disk after cleanup:"
          df -h C: || true
      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent ${{ matrix.qt }}

      - name: Read configuration matrix.
        shell: bash
        run: |
          ARTIFACT_NAME="Telegram"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator: $GENERATOR"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.generator }}"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define: $DEFINE"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.defines }}"
          fi
          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_ID=${{ secrets.API_ID }} -D TDESKTOP_API_HASH=${{ secrets.API_HASH }}"
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        run: |
          set +e
          echo "Disk before free-up:"
          df -h C: || true
          # Remove Qt SOURCE/build only (NOT Qt install prefix Qt-*)
          rm -rf "$LibrariesPath"/qt_* 2>/dev/null || true
          rm -rf "$TBUILD/Libraries/win64"/qt_* 2>/dev/null || true
          rm -rf "$TBUILD/$REPO_NAME/Telegram"/qt_* 2>/dev/null || true
          # Drop Debug objects only (keep RelWithDebInfo objects for static link)
          rm -rf "$LibrariesPath"/Qt-*/lib/objects-Debug 2>/dev/null || true
          # Intermediate objs outside Qt install via python (Git Bash find -prune/-delete is broken)
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ.get("LibrariesPath", "")).resolve()
          if not root.exists():
              print("LibrariesPath missing", root)
              raise SystemExit(0)
          skip = [p.resolve() for p in root.glob("Qt-*")]
          print("protect:", [str(p) for p in skip])
          n = 0
          for dirpath, dirnames, filenames in os.walk(root):
              dp = Path(dirpath).resolve()
              if any(str(dp) == str(sp) or str(dp).startswith(str(sp) + os.sep) for sp in skip):
                  dirnames[:] = []
                  continue
              for fn in filenames:
                  if fn.endswith((".o", ".obj", ".pdb", ".exp", ".ilk", ".idb")):
                      try:
                          (dp / fn).unlink()
                          n += 1
                      except OSError:
                          pass
          print("deleted", n, "intermediate objects outside Qt install")
          PY
          echo "Disk after free-up:"
          df -h C: || true

      - name: Disk cleanup before build
        shell: bash
        run: |
          set +e
          echo "Disk before cleanup: AGGRESSIVE_DISK_v25"
          df -h C: || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules 2>/dev/null || true
          sudo rm -rf /opt/microsoft /opt/az 2>/dev/null || true
          # Runner tool caches on C: (Windows paths via Git Bash)
          rm -rf /c/hostedtoolcache/windows/CodeQL 2>/dev/null || true
          rm -rf /c/hostedtoolcache/windows/go 2>/dev/null || true
          rm -rf /c/hostedtoolcache/windows/Ruby 2>/dev/null || true
          rm -rf /c/hostedtoolcache/windows/Java_Temurin-Hotspot_jdk 2>/dev/null || true
          rm -rf /c/hostedtoolcache/windows/Python/3.9* 2>/dev/null || true
          rm -rf /c/SeleniumWebDrivers 2>/dev/null || true
          rm -rf /c/tools/kotlinc /c/tools/php 2>/dev/null || true
          rm -rf /c/ProgramData/chocolatey/lib/pulumi 2>/dev/null || true
          rm -rf /c/Users/runneradmin/AppData/Local/Temp/* 2>/dev/null || true
          rm -rf /c/Users/runneradmin/AppData/Local/NuGet 2>/dev/null || true
          echo "Removing qt_* source/build (keep Qt-* install):"
          rm -rf "$LibrariesPath"/qt_* 2>/dev/null || true
          rm -rf "$TBUILD/Libraries/win64"/qt_* 2>/dev/null || true
          rm -rf "$TBUILD/Libraries"/qt_* 2>/dev/null || true
          rm -rf "$TBUILD/$REPO_NAME/Telegram"/qt_* 2>/dev/null || true
          rm -rf "$LibrariesPath"/Qt-*/lib/objects-Debug 2>/dev/null || true
          # Keep .git for patches; remove msys64
          rm -rf "$TBUILD/ThirdParty/msys64" 2>/dev/null || true
          python - <<'PY'
          import os, shutil
          from pathlib import Path

          def is_under_qt(p: Path) -> bool:
              for part in p.parts:
                  if part.lower().startswith("qt-"):
                      return True
              return False

          roots = []
          for key in ("LibrariesPath",):
              v = os.environ.get(key)
              if v:
                  roots.append(Path(v))
          tb = os.environ.get("TBUILD")
          if tb:
              roots += [Path(tb) / "Libraries" / "win64", Path(tb) / "Libraries"]

          seen = set()
          removed_dirs = removed_files = 0
          for root in roots:
              try:
                  root = root.resolve()
              except Exception:
                  continue
              if not root.exists() or str(root) in seen:
                  continue
              seen.add(str(root))
              # delete Debug-ish directories outside Qt install
              for dirpath, dirnames, filenames in os.walk(root, topdown=True):
                  dp = Path(dirpath)
                  if is_under_qt(dp):
                      dirnames[:] = []
                      continue
                  for d in list(dirnames):
                      if d.lower() in {"debug", "out.dbg", "debug-static", "relwithdebinfo"} and d.lower() != "release":
                          # keep RelWithDebInfo only inside Qt (already skipped); outside dep trees drop non-Release
                          # Do NOT drop Release. Drop Debug / out.dbg. Keep RelWithDebInfo for rare deps? Safe: only Debug/out.dbg
                          if d.lower() in {"debug", "out.dbg", "debug-static"}:
                              target = dp / d
                              shutil.rmtree(target, ignore_errors=True)
                              dirnames.remove(d)
                              removed_dirs += 1
                  for fn in filenames:
                      low = fn.lower()
                      if low.endswith((".pdb", ".ilk", ".exp", ".idb", ".obj", ".o")):
                          try:
                              (dp / fn).unlink()
                              removed_files += 1
                          except OSError:
                              pass
          print("removed Debug dirs:", removed_dirs, "files:", removed_files)
          # verify qrc object still present
          hits = []
          for root in list(seen):
              r = Path(root)
              if not r.exists():
                  continue
              for p in r.glob("Qt-*/lib/objects-RelWithDebInfo"):
                  hits.extend(p.rglob("qrc_qpdf_init.cpp.obj"))
          print("qrc_qpdf_init.cpp.obj hits:", [str(h) for h in hits[:3]])
          print("OK: static Qt objects present" if hits else "WARNING: qrc_qpdf_init.cpp.obj missing")
          # protoc check
          for root in list(seen):
              p = Path(root) / "protobuf" / "build" / "Release" / "protoc.exe"
              if p.exists():
                  print("protoc still at", p)
          PY
          echo "Disk after cleanup:"
          df -h C: || true

      - name: Patch cmake helpers (zbar + CMake 4 CMP0218).
        shell: bash
        run: |
          set +e
          ROOT="$TBUILD/$REPO_NAME"
          CMARK="$ROOT/cmake/external/cmark_gfm/CMakeLists.txt"
          RCM="$ROOT/cmake/run_cmake.py"
          ZBAR_PATCH="$ROOT/patches/cmake_zbar.patch"

          # 1) Force-apply cmake_zbar.patch without git (Disk cleanup may remove .git)
          if [ -f "$ZBAR_PATCH" ] && [ -d "$ROOT/cmake" ]; then
            if [ -f "$ROOT/cmake/external/zbar/CMakeLists.txt" ]; then
              echo "zbar cmake already present"
            else
              echo "Applying cmake_zbar.patch with patch(1) into cmake/"
              (cd "$ROOT/cmake" && patch -p1 --forward --reject-file=- < "$ZBAR_PATCH") || true
              if [ -f "$ROOT/cmake/external/zbar/CMakeLists.txt" ]; then
                echo "zbar cmake applied OK"
              else
                echo "ERROR: zbar cmake still missing after patch"
                ls -la "$ROOT/cmake/external/" | head
                exit 1
              fi
            fi
            grep -n zbar "$ROOT/cmake/external/CMakeLists.txt" || true
          else
            echo "ERROR: missing zbar patch or cmake dir"
            exit 1
          fi

          # 2) cmark CMP0218
          if [ -f "$CMARK" ]; then
            if ! grep -q 'CMP0218' "$CMARK"; then
              sed -i '/set(CMAKE_ERROR_DEPRECATED FALSE CACHE BOOL "" FORCE)/i\    if (POLICY CMP0218)\n        cmake_policy(SET CMP0218 NEW)\n    endif()\n    set(CMAKE_POLICY_DEFAULT_CMP0218 NEW)' "$CMARK"
              echo "cmark CMP0218 patched"
            else
              echo "cmark already has CMP0218"
            fi
          fi

          # 3) run_cmake: do not promote deprecated/policy to errors on CMake 4
          if [ -f "$RCM" ]; then
            sed -i "s/'-Werror=dev', '-Werror=deprecated'/'-Werror=dev', '-Wno-error=deprecated', '-Wno-error=policy', '-Wno-error=author'/g" "$RCM"
            grep -n "Werror\|Wno-error" "$RCM" || true
          fi

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D "CMAKE_EXE_LINKER_FLAGS=/DEFAULTLIB:Synchronization.lib /DEFAULTLIB:WindowsApp.lib /FORCE:MULTIPLE" ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
          -D CMAKE_POLICY_DEFAULT_CMP0218=NEW ^
          -Wno-error=policy ^
          -Wno-error=author ^
          %TDESKTOP_BUILD_DEFINE%

          rem configure.bat/cmd often leaves a stale errorlevel even after CMake succeeds
          if not exist "..\out\CMakeCache.txt" (
            echo CONFIGURE FAILED: ..\out\CMakeCache.txt missing
            exit /b 1
          )
          echo CONFIGURE OK: CMakeCache.txt present

          if exist "%LibrariesPath%\protobuf\build\Release\protoc.exe" (
            echo protoc OK: %LibrariesPath%\protobuf\build\Release\protoc.exe
          ) else (
            echo WARN: expected protoc path missing, searching...
            dir /s /b "%LibrariesPath%\protobuf\*protoc.exe" 2>nul
            where protoc 2>nul
          )

          cmake --build ..\out --config Release --parallel 3 -- /p:CL_MPCount=2 /p:DebugSymbols=false /p:DebugType=None

      - name: Move artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\Telegram.exe artifact/
          move %OUT%\Updater.exe artifact/
      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
